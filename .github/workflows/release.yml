name: Release

# Builds the server-ready app (vendor/ included, CSS compiled) and publishes it
# two ways, because the owner has no terminal or Composer on the host:
#   1. mke-<version>.zip on the GitHub Release (File Manager upload, folder swap)
#   2. the "release" branch (cPanel Git Version Control + .cpanel.yml)
# See DEPLOY.md and docs/DECISIONS.md.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to build. To roll back, enter an older tag such as v0.0.1.
        required: true
        default: main
      publish_branch:
        description: Update the "release" branch (cPanel Git Version Control)
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-release.sh
      - scripts/publish-release-branch.sh
      - scripts/test-deploy.sh
      - deploy/**
      - composer.json
      - composer.lock

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.ref }}

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_mysql, zip, gd, fileinfo, xml, openssl, curl
          tools: composer:v2
          coverage: none

      - name: Work out the version
        id: version
        run: |
          if tag="$(git describe --tags --exact-match HEAD 2>/dev/null)"; then
            echo "version=$tag" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          for attempt in 1 2 3; do
            ./scripts/build-release.sh "${{ steps.version.outputs.version }}" && exit 0
            echo "build-release failed (attempt $attempt); retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Check the zip layout
        run: |
          listing="$(unzip -Z1 "build/mke-${{ steps.version.outputs.version }}.zip")"
          for entry in .htaccess app/public/index.php app/vendor/autoload.php app/version.json \
                       shared.example/.env.example shared.example/.htaccess shared.example/storage/.htaccess; do
            grep -qx "$entry" <<<"$listing" || { echo "missing from zip: $entry"; exit 1; }
          done
          if grep -qE '(^|/)\.env$' <<<"$listing"; then echo "zip must not contain a .env"; exit 1; fi

      - name: Check the release branch tree and its deploy
        run: |
          tree=build/release-tree
          for f in .cpanel.yml deploy/cpanel/deploy.sh deploy/root.htaccess deploy/shared.example/.htaccess \
                   deploy/shared.example/storage/.htaccess vendor/autoload.php public/index.php; do
            [ -f "$tree/$f" ] || { echo "missing from release tree: $f"; exit 1; }
          done
          if [ -e "$tree/.env" ]; then echo "release tree must not contain a .env"; exit 1; fi
          ./scripts/test-deploy.sh "$tree"

      - name: Upload zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mke-${{ steps.version.outputs.version }}
          path: build/mke-${{ steps.version.outputs.version }}.zip
          retention-days: 30

      - name: Attach zip to the GitHub Release
        if: github.event_name != 'pull_request' && steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          zip="build/mke-$TAG.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" --title "$TAG" --notes "Install or update: see DEPLOY.md. Download mke-$TAG.zip below."
          fi

      - name: Publish the release branch
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/publish-release-branch.sh "${{ steps.version.outputs.version }}" origin release
